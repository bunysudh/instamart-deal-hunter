name: Supabase PostgreSQL Readiness Test

on:
  workflow_dispatch:

jobs:
  test-postgres:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Test PostgreSQL readiness
        run: |
          echo "========================================"
          echo "SUPABASE POSTGRESQL READINESS TEST"
          echo "========================================"

          echo ""
          echo "Host:"
          echo "aws-0-ap-northeast-2.pooler.supabase.com"

          echo ""
          echo "Port:"
          echo "5432"

          echo ""
          echo "=== PG_ISREADY ==="

          pg_isready \
            -h aws-0-ap-northeast-2.pooler.supabase.com \
            -p 5432 \
            -t 15

          RESULT=$?

          echo ""
          echo "pg_isready exit code: $RESULT"

          echo ""
          echo "========================================"

          exit $RESULT
