name: Instamart Deal Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx2

      - name: Test Supabase DNS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          from urllib.parse import urlparse

          host = urlparse(os.environ["SUPABASE_URL"]).hostname
          print("Supabase host:", host)

          for record_type in ("A", "AAAA"):
              url = (
                  "https://cloudflare-dns.com/dns-query"
                  f"?name={host}&type={record_type}"
              )

              req = urllib.request.Request(
                  url,
                  headers={"Accept": "application/dns-json"}
              )

              data = json.load(
                  urllib.request.urlopen(req, timeout=20)
              )

              answers = [
                  a["data"]
                  for a in data.get("Answer", [])
                  if a.get("type") in (1, 28)
              ]

              print(f"{record_type} records:", answers)

      - name: Run Instamart scanner
        env:
          SWIGGY_TOKEN: ${{ secrets.SWIGGY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python cloud_scanner.py

      - name: Show deal results
        if: always()
        run: |
          if [ -f rare_deals.json ]; then
            cat rare_deals.json
          else
            echo "No rare_deals.json was produced."
          fi
