name: Supabase Transaction Pooler Login Test

on:
  workflow_dispatch:

jobs:
  test-login:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Test PostgreSQL login
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGUSER: ${{ secrets.SUPABASE_DB_USER }}
          PGHOST: aws-0-ap-northeast-2.pooler.supabase.com
          PGPORT: "6543"
          PGDATABASE: postgres
          PGSSLMODE: require
        run: |
          echo "========================================"
          echo "SUPABASE TRANSACTION POOLER LOGIN TEST"
          echo "========================================"

          echo "Host: $PGHOST"
          echo "Port: $PGPORT"
          echo "Database: $PGDATABASE"
          echo "User: [hidden]"

          psql \
            -c "SELECT 1 AS connection_test;"

          RESULT=$?

          echo ""
          echo "psql exit code: $RESULT"
          echo "========================================"

          exit $RESULT
