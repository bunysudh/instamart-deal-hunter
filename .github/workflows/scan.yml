name: Instamart Deal Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
  contents: write
  pages: write
  id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx2 psycopg[binary]

      - name: Run Instamart scanner
        env:
          SWIGGY_TOKEN: ${{ secrets.SWIGGY_TOKEN }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python cloud_scanner.py

      - name: Show rare deals
        if: always()
        run: |
          echo "========================================"
          echo "RARE DEAL RESULTS"
          echo "========================================"

          if [ -f rare_deals.json ]; then
            cat rare_deals.json
          else
            echo "No rare_deals.json produced."
          fi
