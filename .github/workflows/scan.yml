name: Supabase Transaction Pooler Login Test

on:
  workflow_dispatch:

jobs:
  test-login:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Test PostgreSQL login
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "========================================"
          echo "SUPABASE TRANSACTION POOLER LOGIN TEST"
          echo "========================================"

          psql \
            "host=aws-0-ap-northeast-2.pooler.supabase.com \
             port=6543 \
             dbname=postgres \
             user=postgres.sauxptutvwaxwicqdfsxc \
             sslmode=require \
             connect_timeout=15" \
            -c "SELECT 1 AS connection_test;"

          RESULT=$?

          echo ""
          echo "psql exit code: $RESULT"
          echo "========================================"

          exit $RESULT
