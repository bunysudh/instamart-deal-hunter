name: Supabase Transaction Pooler Test

on:
  workflow_dispatch:

jobs:
  test-transaction-pooler:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Test Transaction Pooler
        run: |
          echo "========================================"
          echo "SUPABASE TRANSACTION POOLER TEST"
          echo "========================================"

          echo ""
          echo "=== DNS ==="

          nslookup aws-0-ap-northeast-2.pooler.supabase.com

          echo ""
          echo "=== PostgreSQL 6543 ==="

          pg_isready \
            -h aws-0-ap-northeast-2.pooler.supabase.com \
            -p 6543 \
            -t 15

          RESULT=$?

          echo ""
          echo "pg_isready exit code: $RESULT"

          echo ""
          echo "========================================"

          exit $RESULT
