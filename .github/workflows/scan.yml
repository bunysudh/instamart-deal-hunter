name: Supabase Pooler Test

on:
  workflow_dispatch:

jobs:
  test-pooler:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Test Supabase Session Pooler
        run: |
          echo "========================================"
          echo "SUPABASE SESSION POOLER TEST"
          echo "========================================"

          echo ""
          echo "=== DNS ==="

          nslookup aws-0-ap-northeast-2.pooler.supabase.com

          echo ""
          echo "=== TCP 5432 ==="

          curl -v \
            telnet://aws-0-ap-northeast-2.pooler.supabase.com:5432 \
            --connect-timeout 15 \
            --max-time 30

          echo ""
          echo "========================================"
          echo "POOLER TEST COMPLETE"
          echo "========================================"
